spring:
  application:
    name: tothework
  datasource:
    # 서비스 테이블은 모두 자기 스키마(tw_identity, tw_store ...)를 명시해서 쓴다. 기본 데이터베이스인 tw_shared에는
    # 스키마를 지정할 수 없는 공용 인프라 테이블(이벤트 발행 기록)만 들어간다. MySQL에서는 스키마가 곧 데이터베이스라
    # Spring Modulith가 발행 기록 테이블의 스키마 지정을 지원하지 않기 때문이다.
    url: ${DB_URL:jdbc:mysql://localhost:3306/tw_shared?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:root}
    # 기존 배포의 환경변수 이름(MYSQL_PASSWORD)도 받는다. 서버의 env 파일을 고치지 않고 전환할 수 있게.
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:}}

  # 가입 인증·비밀번호 재설정 메일 (Gmail SMTP). 미설정이어도 기동은 되고 보내는 시점에만 실패한다.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Spring AI (OpenAI) — 근로 상담과 스케줄 초안에 쓴다.
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4.1-mini
          temperature: 0.3
      embedding:
        options:
          model: text-embedding-3-small

  modulith:
    events:
      # 발행 기록 테이블은 shared가 Flyway로 tw_shared에 만든다. Modulith가 직접 만들지 않게 한다.
      jdbc:
        schema-initialization:
          enabled: false
      # 끝난 발행 기록은 지운다. 미완료만 남아 재전달 대상이 된다.
      completion-mode: delete
      # 단일 인스턴스 배포라 재시작 때 미완료 이벤트를 다시 보낸다. 여러 대로 늘리면 끄고 다른 방식으로 재전달할 것.
      republish-outstanding-events-on-restart: true

# 앱은 루프백에만 바인딩하고 nginx가 앞에서 TLS를 끝낸다. 프록시가 붙인 X-Forwarded-*를 믿어야 리다이렉트·
# 쿠키·호출 제한이 실제 클라이언트 기준으로 동작한다.
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8080
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:NATIVE}

# 파일 로그. 작은 인스턴스에서 로그가 디스크를 채우면 서버가 죽으므로 총량 상한을 둔다.
logging:
  file:
    name: ${LOG_FILE:logs/tothework.log}
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 1GB
  level:
    com.tothework: ${LOG_LEVEL_APP:INFO}

# Actuator는 별도 포트의 루프백 전용. loggers는 로그 레벨을 바꾸는 쓰기 엔드포인트라 외부에 열면 안 되고,
# nginx가 이 포트를 프록시하지 않는 것이 방어선이다. 확인은 서버에서 curl localhost:8081/actuator/health.
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

tothework:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 900000        # 15분
    refresh-token-expiration-ms: 1209600000   # 14일
  web:
    cors:
      # 리프레시 토큰 쿠키 때문에 와일드카드를 쓸 수 없어 오리진을 나열한다.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    s3:
      bucket-name: ${AWS_S3_BUCKET_NAME:}
      region: ${AWS_REGION:ap-northeast-2}
  identity:
    base-url: ${APP_BASE_URL:http://127.0.0.1:8080}
    frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
    cookie-secure: ${COOKIE_SECURE:false}
    unverified-retention-days: 7
  laborqa:
    # 실제 점수를 재 보고 정한 값이다. 자료에 있는 질문을 그대로 물으면 0.42, 돌려 말하면 0.30 근처였고,
    # 전혀 무관한 질문(날씨)이 0.27이었다. 간격이 좁아 문턱 하나로 깨끗이 가를 수 없어서, 낮게 두어 근거를
    # 최대한 붙여 보내고 그걸로 답할지는 프롬프트가 판단하게 한다.
    similarity-threshold: ${LABOR_QA_SIMILARITY_THRESHOLD:0.28}
    top-k: ${LABOR_QA_TOP_K:5}
    # 지식베이스 적재 API(POST /api/v1/labor-qa/admin/ingest) 호출용 토큰. 비어 있으면 그 API는 열리지 않는다.
    admin-ingest-token: ${ADMIN_INGEST_TOKEN:}
    vector-store:
      url: ${VECTOR_DB_URL:jdbc:postgresql://localhost:5432/albam_vector}
      username: ${VECTOR_DB_USERNAME:albam_app}
      password: ${VECTOR_DB_PASSWORD:}
