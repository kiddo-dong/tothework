# ToTheWork 백엔드용 nginx 리버스 프록시 설정 (EC2 배포용)
#
# 설치 위치: /etc/nginx/sites-available/albam.conf
#           → /etc/nginx/sites-enabled/ 에 심볼릭 링크
#
# 전제
#   - Spring Boot 앱이 127.0.0.1:8080 에서 실행 중
#   - 관리 포트(8081)는 여기서 프록시하지 않는다. Actuator의 loggers는 로그 레벨을
#     바꾸는 쓰기 엔드포인트라 외부에 열리면 안 되고, 루프백 바인딩이 그 유일한 방어선이다.
#   - 인증서는 certbot으로 발급 (아래 "발급 순서" 참고)
#
# 발급 순서
#   1) sudo apt install nginx certbot python3-certbot-nginx
#   2) 먼저 아래 80 서버 블록만 둔 채로 nginx 기동 (certbot이 도메인 소유 확인을 해야 함)
#   3) sudo certbot --nginx -d api.example.com
#      → certbot이 인증서를 발급하고 443 블록을 자동으로 채워준다
#   4) 자동 갱신 확인: sudo certbot renew --dry-run
#
#   ※ api.example.com 을 실제 도메인으로 바꿔야 한다.

upstream albam_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # certbot이 도메인 확인에 쓰는 경로는 리다이렉트하지 않고 그대로 응답해야 갱신이 된다.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    # certbot이 채워주는 경로 (수동 설정 시 실제 경로로 교체)
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS: 이 도메인은 앞으로 HTTPS로만 접속하라고 브라우저에 알린다.
    # 한 번 받은 브라우저는 만료까지 http 접속을 시도조차 하지 않으므로,
    # HTTPS가 확실히 자리잡은 뒤에 켜는 것이 안전하다 (되돌리기 어렵다).
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 업로드 한도. Spring의 multipart 설정(10MB)보다 작으면 nginx가 먼저 413으로 끊어
    # 앱이 준비한 에러 메시지를 못 주므로, 여유를 두고 맞춘다.
    client_max_body_size 12M;

    # AI 엔드포인트(근로기준법 Q&A, 스케줄 초안)는 OpenAI 응답을 기다리므로
    # 기본 60초로는 끊길 수 있다.
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    location / {
        proxy_pass http://albam_backend;
        proxy_http_version 1.1;

        # 앱이 "원래 요청은 HTTPS였고, 진짜 클라이언트는 이 IP였다"를 알 수 있는 유일한 통로.
        # 이 헤더들이 없으면 Secure 쿠키가 나가지 않아 로그인이 깨진다
        # (application.properties의 server.forward-headers-strategy 주석 참고).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_set_header Connection "";
    }

    # 관리 포트(8081)는 의도적으로 프록시하지 않는다. 상태 확인은 EC2에 SSH로 들어가서
    #   curl localhost:8081/actuator/health
    # 로 하거나 SSH 터널을 쓴다.
}
