spring:
  application:
    name: tothework
  datasource:
    # 서비스 테이블은 모두 자기 스키마(tw_identity, tw_store ...)를 명시해서 쓴다. 기본 데이터베이스인 tw_shared에는
    # 스키마를 지정할 수 없는 공용 인프라 테이블(이벤트 발행 기록)만 들어간다. MySQL에서는 스키마가 곧 데이터베이스라
    # Spring Modulith가 발행 기록 테이블의 스키마 지정을 지원하지 않기 때문이다.
    url: ${DB_URL:jdbc:mysql://localhost:3306/tw_shared?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:root}
    # 기존 배포의 환경변수 이름(MYSQL_PASSWORD)도 받는다. 서버의 env 파일을 고치지 않고 전환할 수 있게.
    password: ${DB_PASSWORD:${MYSQL_PASSWORD:}}

  # 가입 인증·비밀번호 재설정 메일 (Gmail SMTP). 미설정이어도 기동은 되고 보내는 시점에만 실패한다.
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # JavaMail의 기본 타임아웃은 무한이다. 메일은 가입·재설정 요청 안에서 동기로 보내므로, SMTP가 응답하지 않으면
      # 요청 스레드가 끝없이 붙잡힌다. 실패하면 사용자가 재발송으로 다시 받을 수 있다.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Spring AI (OpenAI) — 근로 상담과 스케줄 초안에 쓴다.
  # 기본값(요청당 60초, 재시도 3번)이면 한 요청이 4분까지 걸린다. ALB는 유휴 타임아웃(120초로 설정)에 끊으므로, 사용자는
  # 504를 받는데 서버는 계속 재시도하며 요금을 낸다. 최악의 경우를 (30초 × 2번)으로 ALB 안쪽에 묶는다.
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        timeout: 30s
        max-retries: 1
        options:
          model: gpt-4.1-mini
          temperature: 0.3
          # 답변 길이도 비용이다. 스케줄 초안(31일 × 여러 명의 JSON)이 잘리지 않을 만큼만 둔다.
          max-tokens: 4096
      embedding:
        timeout: 30s
        max-retries: 1
        options:
          model: text-embedding-3-small

  modulith:
    events:
      # 발행 기록 테이블은 shared가 Flyway로 tw_shared에 만든다. Modulith가 직접 만들지 않게 한다.
      jdbc:
        schema-initialization:
          enabled: false
      # 끝난 발행 기록은 지운다. 미완료만 남아 재전달 대상이 된다.
      completion-mode: delete
      # 단일 인스턴스 배포라 재시작 때 미완료 이벤트를 다시 보낸다. 여러 대로 늘리면 끄고 다른 방식으로 재전달할 것.
      republish-outstanding-events-on-restart: true

  # 서버 간 채팅 이벤트 전달(Pub/Sub)에만 쓴다. 저장소로 쓰지 않으므로 Redis가 비어도 잃는 데이터는 없다.
  # 운영(ElastiCache 전송 중 암호화)에서는 REDIS_SSL=true. 응답이 없으면 메시지 전송이 오래 붙잡히지 않게 짧게 끊는다.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      connect-timeout: 2s
      timeout: 2s

# 운영에서는 ALB가 TLS를 끝내고 8080으로 보낸다. 기본 바인딩은 루프백이라 운영은 SERVER_ADDRESS=0.0.0.0으로 열고,
# EC2 보안 그룹이 8080을 ALB에서만 허용한다. ALB가 붙인 X-Forwarded-*를 믿어야 리다이렉트·쿠키·호출 제한이 실제
# 클라이언트 기준으로 동작한다(NATIVE는 사설 대역에서 온 헤더만 믿는다).
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8080
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:NATIVE}

# 파일 로그. 작은 인스턴스에서 로그가 디스크를 채우면 서버가 죽으므로 총량 상한을 둔다.
logging:
  file:
    name: ${LOG_FILE:logs/tothework.log}
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 30
      total-size-cap: 1GB
  level:
    com.tothework: ${LOG_LEVEL_APP:INFO}

# Actuator는 별도 포트의 루프백 전용. loggers는 로그 레벨을 바꾸는 쓰기 엔드포인트라 외부에 열면 안 되고,
# 루프백 바인딩이라 ALB로도 닿지 않는 것이 방어선이다. 확인은 서버에서 curl localhost:8081/actuator/health.
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always
      # 로드밸런서용 헬스체크. 관리 포트는 외부에 못 열므로 readiness 그룹만 앱 포트의 /health로 내보낸다.
      # DB가 죽었거나 종료 중(graceful shutdown)이면 503이라 LB가 트래픽을 뺀다. 외부에 보이므로 상세는 숨긴다.
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
          additional-path: "server:/health"
          show-components: never
          show-details: never

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

tothework:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 900000        # 15분
    refresh-token-expiration-ms: 1209600000   # 14일
  web:
    cors:
      # 리프레시 토큰 쿠키 때문에 와일드카드를 쓸 수 없어 오리진을 나열한다.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  chat:
    # 웹소켓 핸드셰이크를 허용할 오리진. 따로 주지 않으면 CORS와 같은 프론트 주소를 쓴다. 콤마로 여러 개.
    allowed-origins: ${CHAT_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:http://localhost:5173}}
    # 수동 테스트 페이지(/chat-test.html). 운영에서는 켜지 않는다.
    test-page-enabled: ${CHAT_TEST_PAGE_ENABLED:false}
    # 서버 간 전달 방식. redis(기본, 서버 여러 대) 또는 local(서버 1대 전용, 서버 2대 재현의 비교용).
    relay: ${CHAT_RELAY:redis}
    # 이 서버의 이름. 클라이언트가 어느 서버에 붙었는지 보여 주고 연결 로그에 남는다.
    server-id: ${SERVER_ID:${HOSTNAME:local}}
  storage:
    s3:
      bucket-name: ${AWS_S3_BUCKET_NAME:}
      region: ${AWS_REGION:ap-northeast-2}
  identity:
    base-url: ${APP_BASE_URL:http://127.0.0.1:8080}
    frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
    cookie-secure: ${COOKIE_SECURE:false}
    unverified-retention-days: 7
  laborqa:
    # 실제 점수를 재 보고 정한 값이다. 자료에 있는 질문을 그대로 물으면 0.42, 돌려 말하면 0.30 근처였고,
    # 전혀 무관한 질문(날씨)이 0.27이었다. 간격이 좁아 문턱 하나로 깨끗이 가를 수 없어서, 낮게 두어 근거를
    # 최대한 붙여 보내고 그걸로 답할지는 프롬프트가 판단하게 한다.
    similarity-threshold: ${LABOR_QA_SIMILARITY_THRESHOLD:0.28}
    top-k: ${LABOR_QA_TOP_K:5}
    # 기동 직후 백그라운드에서 벡터 저장소·OpenAI에 미리 연결해, 재시작 뒤 첫 질문이 연결 비용을 내지 않게 한다.
    warm-up-on-startup: ${LABOR_QA_WARM_UP:true}
    # 지식베이스 적재 API(POST /api/v1/labor-qa/admin/ingest) 호출용 토큰. 비어 있으면 그 API는 열리지 않는다.
    admin-ingest-token: ${ADMIN_INGEST_TOKEN:}
    vector-store:
      url: ${VECTOR_DB_URL:jdbc:postgresql://localhost:5432/albam_vector}
      username: ${VECTOR_DB_USERNAME:albam_app}
      password: ${VECTOR_DB_PASSWORD:}
