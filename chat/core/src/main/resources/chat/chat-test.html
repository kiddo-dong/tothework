<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매장 채팅 테스트</title>
<!-- 수동 테스트용. CHAT_TEST_PAGE_ENABLED=true일 때만 /chat-test.html로 열린다. -->
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 16px auto; padding: 0 16px; }
  fieldset { margin-bottom: 12px; }
  input { margin: 2px 4px 2px 0; }
  #messages { border: 1px solid #ccc; height: 360px; overflow-y: auto; padding: 8px; }
  .msg { padding: 4px 0; border-bottom: 1px solid #eee; }
  .msg.mine { background: #f3f8ff; }
  .msg.deleted .content { color: #999; font-style: italic; }
  .meta { font-size: 12px; color: #666; }
  .msg button { font-size: 11px; margin-left: 4px; }
  #log { font-size: 12px; color: #a00; white-space: pre-wrap; max-height: 120px; overflow-y: auto; }
  #status { font-weight: bold; }
</style>
</head>
<body>
<h1>매장 채팅 테스트</h1>

<fieldset>
  <legend>1. 로그인</legend>
  <input id="email" placeholder="이메일" autocomplete="username">
  <input id="password" type="password" placeholder="비밀번호" autocomplete="current-password">
  <button id="login">로그인</button>
  <span id="me"></span>
</fieldset>

<fieldset>
  <legend>2. 매장 입장</legend>
  <input id="storeId" type="number" placeholder="storeId">
  <button id="connect">입장</button>
  <button id="disconnect">나가기</button>
  상태: <span id="status">연결 안 됨</span>
</fieldset>

<button id="older">이전 메시지 더 보기</button>
<div id="messages"></div>

<form id="sendForm">
  <input id="content" maxlength="500" size="60" placeholder="메시지 (500자)">
  <button>보내기</button>
</form>

<h3>오류</h3>
<div id="log"></div>

<script>
  const $ = (id) => document.getElementById(id);
  let token = null;
  let myUserId = null;
  let storeId = null;
  let client = null;
  /** 메시지 id → 메시지. 구독으로 온 것과 조회한 것을 id로 합쳐 중복을 없앤다. */
  const messages = new Map();

  function log(text) {
    $('log').textContent = new Date().toLocaleTimeString() + ' ' + text + '\n' + $('log').textContent;
  }

  async function api(path, options = {}) {
    const response = await fetch(path, {
      ...options,
      headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    });
    const body = await response.json();
    if (!body.success) throw new Error(body.message || response.status);
    return body.data;
  }

  $('login').onclick = async () => {
    try {
      const data = await api('/api/v1/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email: $('email').value, password: $('password').value }),
      });
      token = data.accessToken;
      const me = await api('/api/v1/users/me');
      myUserId = me.id;
      $('me').textContent = me.name + ' (userId ' + me.id + ')';
    } catch (e) {
      log('로그인 실패: ' + e.message);
    }
  };

  function upsert(message) {
    messages.set(message.id, message);
  }

  function render() {
    const box = $('messages');
    const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 4;
    box.replaceChildren();
    [...messages.values()].sort((a, b) => a.id - b.id).forEach((m) => {
      const row = document.createElement('div');
      row.className = 'msg' + (m.senderId === myUserId ? ' mine' : '') + (m.deleted ? ' deleted' : '');
      const meta = document.createElement('div');
      meta.className = 'meta';
      const edited = !m.deleted && m.updatedAt && m.updatedAt !== m.createdAt ? ' (수정됨)' : '';
      meta.textContent = '#' + m.id + ' ' + (m.senderName ?? '알 수 없음') + ' · ' + m.createdAt + edited;
      const content = document.createElement('div');
      content.className = 'content';
      content.textContent = m.content; // innerHTML을 쓰지 않는다 (XSS)
      row.append(meta, content);
      if (m.senderId === myUserId && !m.deleted) {
        const edit = document.createElement('button');
        edit.textContent = '수정';
        edit.onclick = () => {
          const next = prompt('수정할 내용', m.content);
          if (next != null) publish('chat.edit', { messageId: m.id, content: next });
        };
        const del = document.createElement('button');
        del.textContent = '삭제';
        del.onclick = () => publish('chat.delete', { messageId: m.id });
        meta.append(edit, del);
      }
      box.append(row);
    });
    if (atBottom) box.scrollTop = box.scrollHeight;
  }

  async function loadPage(before) {
    const query = new URLSearchParams({ size: '30' });
    if (before != null) query.set('before', before);
    const page = await api('/api/v1/stores/' + storeId + '/chat/messages?' + query);
    page.forEach(upsert);
    render();
    return page.length;
  }

  function publish(action, body) {
    if (!client || !client.connected) return log('연결되지 않았습니다.');
    client.publish({ destination: '/app/stores/' + storeId + '/' + action, body: JSON.stringify(body) });
  }

  $('connect').onclick = () => {
    if (!token) return log('먼저 로그인하세요.');
    if (client) client.deactivate();
    storeId = Number($('storeId').value);
    messages.clear();
    render();
    const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
    client = new StompJs.Client({
      brokerURL: scheme + '://' + location.host + '/ws',
      connectHeaders: { Authorization: 'Bearer ' + token },
      heartbeatIncoming: 10000,
      heartbeatOutgoing: 10000,
      reconnectDelay: 3000,
      // 연결될 때마다(재접속 포함) 호출된다. 구독은 연결에 묶여 있어 끊기면 사라지므로 여기서 매번 다시 건다.
      onConnect: async () => {
        $('status').textContent = '연결됨';
        client.subscribe('/user/queue/errors', (m) => log('오류: ' + JSON.parse(m.body).message));
        // 1) 구독을 먼저 건다. 2) 그다음 최신 메시지를 읽는다. 반대로 하면 둘 사이에 온 메시지를 놓친다.
        //    둘 다에 들어온 메시지는 id로 합쳐져 한 번만 보인다. 재접속 때는 끊긴 동안의 메시지가 여기서 채워진다.
        client.subscribe('/topic/stores/' + storeId + '/chat', (m) => {
          const event = JSON.parse(m.body);
          upsert(event.message);
          render();
        });
        try {
          await loadPage(null);
        } catch (e) {
          log('조회 실패: ' + e.message);
        }
      },
      onStompError: (frame) => {
        // 프로토콜 오류(인증 실패, 소속 아닌 매장). 서버가 연결을 끊는다. 같은 이유로 계속 재접속하지 않게 멈춘다.
        log('연결 거부: ' + (frame.headers.message || frame.body));
        client.deactivate();
        $('status').textContent = '거부됨';
      },
      onWebSocketClose: () => {
        if (client && client.active) $('status').textContent = '재접속 중...';
      },
    });
    client.activate();
  };

  $('disconnect').onclick = () => {
    if (client) client.deactivate();
    $('status').textContent = '연결 안 됨';
  };

  $('older').onclick = async () => {
    if (!storeId || messages.size === 0) return;
    const oldest = Math.min(...messages.keys());
    try {
      if ((await loadPage(oldest)) === 0) log('더 이전 메시지가 없습니다.');
    } catch (e) {
      log('조회 실패: ' + e.message);
    }
  };

  $('sendForm').onsubmit = (e) => {
    e.preventDefault();
    publish('chat.send', { content: $('content').value });
    $('content').value = '';
  };
</script>
</body>
</html>
