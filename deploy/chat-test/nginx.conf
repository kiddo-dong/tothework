# 서버 2대 재현용 nginx. 운영용(deploy/nginx/albam.conf)과 달리 TLS 없이 두 앱에 번갈아 보낸다.

upstream albam_apps {
    # 기본 라운드로빈. 웹소켓은 연결이 열릴 때 한 번 고른 서버에 끝까지 붙어 있으므로, 탭을 새로 열 때마다 번갈아
    # 붙는다. SockJS를 쓰지 않아 스티키 세션은 필요 없다.
    server app1:8080;
    server app2:8080;
}

# 웹소켓 업그레이드 요청이면 Connection: upgrade, 아니면 close.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # 어느 앱이 응답했는지 보이게 한다 (REST 조회가 번갈아 가는지 확인용).
    add_header X-Upstream $upstream_addr always;

    # 내려간 앱으로의 연결은 거절되지 않고 매달린다(기본 60초). 짧게 끊어야 바로 다른 앱으로 넘어간다.
    proxy_connect_timeout 2s;

    # proxy_set_header는 location 안에 하나라도 있으면 바깥 것을 상속하지 않는다. 그래서 위로 모으지 않고 각
    # location에 다 적는다. 빠지면 Host가 upstream 이름(albam_apps)으로 나가 Tomcat이 400으로 거절한다.

    location /ws {
        proxy_pass http://albam_apps;
        # 웹소켓은 HTTP/1.1의 Upgrade로 시작한다. 이 세 줄이 없으면 핸드셰이크가 일반 요청으로 끝난다.
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 이 시간 동안 아무 프레임도 없으면 nginx가 끊는다. STOMP 하트비트(10초)보다 넉넉히 길게 둔다.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass http://albam_apps;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
