# 매장 채팅을 서버 2대로 재현한다. 운영 배포용이 아니다 (deploy/chat-test/README.md).
#
#   ./gradlew :app:bootJar
#   cp deploy/chat-test/.env.example deploy/chat-test/.env   # 값 채우기
#   docker compose -f docker-compose.chat-test.yml --env-file deploy/chat-test/.env up -d
#
# 브라우저는 로컬 로드밸런서(lb, http://localhost:8088)로만 들어온다. 운영의 ALB 대신 nginx가 app1·app2에 번갈아
# 보낸다. 운영에는 nginx가 없다.
# 두 앱은 반드시 같은 MySQL을 쓴다. 인메모리 DB를 쓰면 서버마다 메시지가 따로 쌓여 재현이 성립하지 않는다.

x-app: &app
  image: eclipse-temurin:25-jre
  command: ["java", "-jar", "/app/app.jar"]
  volumes:
    - ./app/build/libs/app-0.0.1-SNAPSHOT.jar:/app/app.jar:ro
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment: &app-env
    # 로드밸런서가 다른 컨테이너라 루프백이 아니라 모든 인터페이스에 바인딩한다(운영의 ALB 뒤와 같다).
    SERVER_ADDRESS: 0.0.0.0
    DB_URL: jdbc:mysql://mysql:3306/tw_shared?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul
    DB_USERNAME: root
    DB_PASSWORD: ${CHAT_TEST_DB_PASSWORD:?deploy/chat-test/.env에 CHAT_TEST_DB_PASSWORD를 채울 것}
    JWT_SECRET: ${CHAT_TEST_JWT_SECRET:?deploy/chat-test/.env에 CHAT_TEST_JWT_SECRET을 채울 것}
    REDIS_HOST: redis
    # redis(기본) 또는 local. local은 Redis 없이 자기 서버에만 보내는 비교용이다 (README 시나리오 1).
    CHAT_RELAY: ${CHAT_RELAY:-redis}
    CHAT_TEST_PAGE_ENABLED: "true"
    CHAT_ALLOWED_ORIGINS: http://localhost:8088
    CORS_ALLOWED_ORIGINS: http://localhost:8088
    APP_BASE_URL: http://localhost:8088
    APP_FRONTEND_URL: http://localhost:8088
    # 채팅과 무관한 외부 연동은 쓰지 않는다. 기동에 필요한 값만 둔다.
    LABOR_QA_WARM_UP: "false"
    AWS_S3_BUCKET_NAME: chat-test
    LOG_FILE: /tmp/tothework.log
    JAVA_TOOL_OPTIONS: -Xmx384m

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${CHAT_TEST_DB_PASSWORD:?deploy/chat-test/.env에 CHAT_TEST_DB_PASSWORD를 채울 것}
      TZ: Asia/Seoul
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  app1:
    <<: *app
    environment:
      <<: *app-env
      SERVER_ID: app1

  app2:
    <<: *app
    environment:
      <<: *app-env
      SERVER_ID: app2

  # 운영의 ALB 대역. 로컬 전용이다.
  lb:
    image: nginx:1.27-alpine
    ports:
      - "8088:80"
    volumes:
      - ./deploy/chat-test/local-alb.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
